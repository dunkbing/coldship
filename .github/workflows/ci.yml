name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        # Builder tests use real git; git needs an identity to commit.
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          go test -race ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Type-check and build
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run build

  binary:
    name: Binary with dashboard
    needs: [go, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: make build
        run: make build
      - name: Smoke test
        run: |
          ./bin/coldship --version
          ./bin/coldship server --addr 127.0.0.1:7070 --data "$RUNNER_TEMP/coldship.db" --proxy=false 2> "$RUNNER_TEMP/server.log" &
          for i in $(seq 30); do curl -sf http://127.0.0.1:7070/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:7070/ | grep -q "<title>Coldship"
          echo "dashboard is served by the binary"
      - name: Docker smoke test
        run: ./scripts/docker-smoke.sh

  install:
    name: Install as a service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build a release and serve it locally
        run: |
          make release VERSION=0.0.0-ci RELEASE_PLATFORMS=linux/amd64
          (cd dist && exec python3 -m http.server 8000 --bind 127.0.0.1) >/dev/null 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/SHA256SUMS >/dev/null && break; sleep 0.5; done
      - name: Install with --service
        run: |
          COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh --service | tee "$RUNNER_TEMP/install.log"
          systemctl is-active coldship
          token=$(grep -o 'cst_[0-9a-f]*' "$RUNNER_TEMP/install.log" | head -1)
          test -n "$token"
          sudo test ! -e /var/lib/coldship/admin-token
          echo "COLDSHIP_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy through the service
        run: |
          coldship deploy --name ci-hello --image nginx:1.27-alpine --port 80 --host-port 18090
          curl -sf http://127.0.0.1:18090/ | grep -q nginx
      - name: Re-running the installer keeps the installation
        run: |
          COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh --service | tee "$RUNNER_TEMP/again.log"
          grep -q "Existing installation" "$RUNNER_TEMP/again.log"
          coldship apps | grep -q ci-hello
      - name: Survives a restart
        run: |
          sudo systemctl restart coldship
          for i in $(seq 30); do curl -sf http://127.0.0.1:7070/healthz >/dev/null && break; sleep 0.5; done
          coldship apps | grep -q ci-hello
      - name: Service log on failure
        if: failure()
        run: sudo journalctl -u coldship -n 100 --no-pager

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
