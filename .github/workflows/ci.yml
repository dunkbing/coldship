name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        # Builder tests use real git; git needs an identity to commit.
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          go test -race ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Type-check and build
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run build

  binary:
    name: Binary with dashboard
    needs: [go, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: make build
        run: make build
      - name: Smoke test
        run: |
          ./bin/coldship --version
          ./bin/coldship server --addr 127.0.0.1:7070 --data "$RUNNER_TEMP/coldship.db" --proxy=false 2> "$RUNNER_TEMP/server.log" &
          for i in $(seq 30); do curl -sf http://127.0.0.1:7070/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:7070/ | grep -q "<title>Coldship"
          echo "dashboard is served by the binary"
      - name: Docker smoke test
        run: ./scripts/docker-smoke.sh

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build a release and serve it locally
        run: |
          make release VERSION=0.0.0-ci RELEASE_PLATFORMS=linux/amd64
          (cd dist && exec python3 -m http.server 8000 --bind 127.0.0.1) >/dev/null 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/SHA256SUMS >/dev/null && break; sleep 0.5; done
      - name: Install (no options)
        run: |
          COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh | tee "$RUNNER_TEMP/install.log"
          systemctl is-active coldship
          grep -q 'cst_[0-9a-f]' "$RUNNER_TEMP/install.log"
          sudo test ! -e /var/lib/coldship/admin-token
          test "$(stat -c %a ~/.config/coldship/config.json)" = 600
      - name: The CLI works without COLDSHIP_TOKEN
        run: |
          test -z "${COLDSHIP_TOKEN:-}"
          coldship deploy --name ci-hello --image nginx:1.27-alpine --port 80 --host-port 18090
          curl -sf http://127.0.0.1:18090/ | grep -q nginx
          docker inspect -f '{{.HostConfig.LogConfig.Config}}' coldship-ci-hello | grep -q max-size
      - name: Re-running the installer keeps the installation
        run: |
          COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh | tee "$RUNNER_TEMP/again.log"
          grep -q "Existing installation" "$RUNNER_TEMP/again.log"
          coldship apps | grep -q ci-hello
      - name: Survives a restart
        run: |
          sudo systemctl restart coldship
          for i in $(seq 30); do curl -sf http://127.0.0.1:7070/healthz >/dev/null && break; sleep 0.5; done
          coldship apps | grep -q ci-hello
      - name: Uninstall, keeping data, then reinstall
        run: |
          docker volume create coldship-unrelated >/dev/null   # not Coldship's: must survive
          coldship deploy --name ci-data --image nginx:1.27-alpine --port 80 --volume files:/data --db postgres
          coldship uninstall --keep-data --yes
          ! systemctl is-active --quiet coldship
          test ! -e /usr/local/bin/coldship
          sudo test -e /var/lib/coldship/coldship.db
          docker volume inspect coldship-ci-data-files coldship-ci-data-db-main-data >/dev/null
          test -z "$(docker ps -aq --filter label=coldship.app)"
          COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh | grep -q "Existing installation"
          coldship login http://127.0.0.1:7070 --token "$(grep -o 'cst_[0-9a-f]*' "$RUNNER_TEMP/install.log" | head -1)"
          coldship apps | grep -q ci-data
      - name: Uninstall everything
        run: |
          coldship uninstall --yes
          ! systemctl is-active --quiet coldship
          test ! -e /etc/systemd/system/coldship.service
          test ! -e /usr/local/bin/coldship
          sudo test ! -e /var/lib/coldship
          test ! -e ~/.config/coldship
          test -z "$(docker ps -aq --filter label=coldship.app)"
          test -z "$(docker ps -aq --filter name=coldship-proxy)"
          ! docker volume inspect coldship-ci-data-files >/dev/null 2>&1
          ! docker volume inspect coldship-ci-data-db-main-data >/dev/null 2>&1
          docker volume inspect coldship-unrelated >/dev/null
          ! docker network inspect coldship >/dev/null 2>&1
      - name: CLI-only install
        run: |
          COLDSHIP_CLI_ONLY=1 COLDSHIP_INSTALL_DIR="$RUNNER_TEMP/cli" COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh
          "$RUNNER_TEMP/cli/coldship" --version
      - name: Service log on failure
        if: failure()
        run: sudo journalctl -u coldship -n 100 --no-pager

  podman:
    name: Podman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: make build
        run: make build
      - name: Start Podman's API socket
        run: |
          podman --version
          sudo systemctl start podman.socket
          sudo curl -fsS --unix-socket /run/podman/podman.sock http://podman/_ping
      - name: Smoke test against Podman
        # Rootful Podman (the socket is root's); the docker CLI in the script
        # talks to Podman too.
        run: sudo env "PATH=$PATH" DOCKER_HOST=unix:///run/podman/podman.sock ./scripts/docker-smoke.sh
      - name: Build a release and serve it locally
        run: |
          make release VERSION=0.0.0-ci RELEASE_PLATFORMS=linux/amd64
          (cd dist && exec python3 -m http.server 8000 --bind 127.0.0.1) >/dev/null 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/SHA256SUMS >/dev/null && break; sleep 0.5; done
      - name: Install with COLDSHIP_ENGINE=podman
        run: |
          COLDSHIP_ENGINE=podman COLDSHIP_DOWNLOAD_BASE=http://127.0.0.1:8000 sh install.sh | tee "$RUNNER_TEMP/install.log"
          grep -q "Podman" "$RUNNER_TEMP/install.log"
          sudo journalctl -u coldship --no-pager | grep -q 'engine=podman'
      - name: Deploy through Podman
        run: |
          coldship deploy --name ci-hello --image nginx:1.27-alpine --port 80 --host-port 18090
          curl -sf http://127.0.0.1:18090/ | grep -q nginx
          test "$(sudo podman inspect -f '{{.HostConfig.RestartPolicy.Name}}' coldship-ci-hello)" = always
          sudo systemctl restart coldship
          for i in $(seq 30); do curl -sf http://127.0.0.1:7070/healthz >/dev/null && break; sleep 0.5; done
          coldship apps | grep -q ci-hello
          coldship uninstall --yes
          test -z "$(sudo podman ps -aq --filter label=coldship.app)"
      - name: Service log on failure
        if: failure()
        run: sudo journalctl -u coldship -n 100 --no-pager || true

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
